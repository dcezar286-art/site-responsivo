<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Personalizados – Camisetas e Canecas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Personalizados</h1>
    <p>Camisetas e Canecas</p>
  </header>

  <main>

    <!-- CANVAS -->
    <canvas id="canvas" width="900" height="900"></canvas>

    <!-- STATUS -->
    <p id="statusMsg"></p>

    <!-- CONTROLES -->
    <section class="controls">

      <!-- PRODUTO -->
      <div class="group">
        <button class="segmented__btn" data-product="tshirt">Camiseta</button>
        <button class="segmented__btn" data-product="mug">Caneca</button>
      </div>

      <!-- COR -->
      <div class="group">
        <button class="segmented__btn" data-color="white">Branco</button>
        <button class="segmented__btn" data-color="black">Preto</button>
      </div>

      <!-- UPLOAD -->
      <div id="dropzone" class="dropzone" tabindex="0">
        <input id="fileInput" type="file" accept="image/*">
        <p>Arraste sua arte ou clique aqui</p>
      </div>

      <!-- AJUSTES -->
      <div class="group">
        <label>Escala</label>
        <input id="scale" type="range" min="0.2" max="2.5" step="0.01" value="1">

        <label>X</label>
        <input id="offsetX" type="range" min="-250" max="250" value="0">

        <label>Y</label>
        <input id="offsetY" type="range" min="-250" max="250" value="0">

        <label>Rotação</label>
        <input id="rotate" type="range" min="-30" max="30" step="0.5" value="0">
      </div>

      <!-- AÇÕES -->
      <div class="group">
        <button id="btnCenter">Centralizar</button>
        <button id="btnClearArt">Remover arte</button>
        <button id="btnReset">Resetar</button>
        <button id="btnExport">Exportar PNG</button>
        <a id="downloadLink" download style="display:none"></a>
      </div>

    </section>

  </main>

  <footer>
    <small>© <span id="year"></span></small>
  </footer>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
